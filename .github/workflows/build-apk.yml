
name: Build AK Downloader APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q AK_MUSIC_VIDEO_DOWNLOADER_ANDROID_PROJECT.zip -d project

      - name: Build APK
        run: |
          cd project/AK_MUSIC_VIDEO_DOWNLOADER_ANDROID
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AK-MUSIC-VIDEO-DOWNLOADER-APK
          path: project/AK_MUSIC_VIDEO_DOWNLOADER_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          
